# Cosmos Cloud compose file for Dropzone — PERSONAL / PRE-FILLED
# Generated from your .env — import this directly into Cosmos > Apps > Import Compose.
#
# DO NOT commit this file to a public repo with real secrets.
# The companion cosmos-compose.yaml (with <CHANGE_ME> placeholders) is the
# public-safe version.
#
# After importing, Cosmos will pull ghcr.io/birdtruther/dropzone-app:latest
# automatically. Make sure the GHCR image has finished building from the latest
# commit before clicking Start.
# Build status: https://github.com/BirdTruther/dropzone-app/actions

services:

  db:
    image: postgres:16-alpine
    container_name: dropzone-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: dropzone
      POSTGRES_PASSWORD: dropzone_pass
      POSTGRES_DB: dropzone
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dropzone -d dropzone"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    labels:
      - cosmos-icon=https://www.postgresql.org/media/img/about/press/elephant.png

  app:
    image: ghcr.io/birdtruther/dropzone-app:latest
    container_name: dropzone-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgresql://dropzone:dropzone_pass@dropzone-db:5432/dropzone
      NEXTAUTH_URL: https://link.birdsserver.cfd
      NEXTAUTH_SECRET: 9T5SXNKLLGtYphjmV566nOkPtrw5mn32
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: BCemEnwRM5yq9z-MaZuZj9173mQSe4TA06mH_nyHP_Yc9hecWFsSXreIFh9qtBzy69Ronhzwp-t05RCsSdhlyLo
      VAPID_PRIVATE_KEY: qtQ-UGl6j1-x95JuOJSxawHkjc7xvqNw7QJ0pl4PwNI
      VAPID_MAILTO: mailto:dehartcd@outlook.com
      NEXT_PUBLIC_SITE_HOSTNAME: link.birdsserver.cfd
      INTERNAL_API_SECRET: "87426184528195419629021178556338"
    volumes:
      - /DATA/AppData/dropzone/dropzone-app/uploads:/app/public/uploads
    depends_on:
      db:
        condition: service_healthy
    labels:
      - cosmos-auto-update=true
      - cosmos-icon=https://raw.githubusercontent.com/BirdTruther/dropzone-app/main/public/icon.png
      - cosmos-url=https://link.birdsserver.cfd
      - cosmos-port=3000
      - cosmos-network=default

# No explicit 'networks:' block — Compose creates the implicit default network
# automatically. Both services resolve each other by container_name.

volumes:
  pg_data:
    driver: local
