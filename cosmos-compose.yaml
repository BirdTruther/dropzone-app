services:
  db:
    image: postgres:16-alpine
    container_name: dropzone-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: dropzone
      POSTGRES_PASSWORD: dropzone_pass
      POSTGRES_DB: dropzone
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - default
    labels:
      - cosmos-icon: https://www.postgresql.org/media/img/about/press/elephant.png

  app:
    image: ghcr.io/birdtruther/dropzone-app:latest
    container_name: dropzone-app
    restart: unless-stopped
    networks:
      - default
    env_file:
      - .env
    volumes:
      # Matches the live host path used by the current deployment.
      # All uploaded files and Facebook video cache live here and persist
      # across every image update and container restart.
      - /DATA/AppData/dropzone/dropzone-app/uploads:/app/public/uploads
    depends_on:
      - db
    labels:
      - cosmos-force-network-secured: true
      - cosmos-auto-update: true
      - cosmos-icon: https://raw.githubusercontent.com/BirdTruther/dropzone-app/main/public/icon.png
      - cosmos-url: dropzone.local
      - cosmos-port: 3000
      - cosmos-network: default

networks:
  default:
    driver: bridge

volumes:
  pg_data:
