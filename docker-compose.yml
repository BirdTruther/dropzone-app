services:
  db:
    image: postgres:16-alpine
    container_name: dropzone-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: dropzone
      POSTGRES_PASSWORD: dropzone_pass
      POSTGRES_DB: dropzone
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  app:
    build: .
    container_name: dropzone-app
    restart: unless-stopped
    ports:
      - "8742:3000"
    env_file:
      - .env
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - uploads:/app/public/uploads

  migrate:
    build: .
    container_name: dropzone-migrate
    env_file:
      - .env
    depends_on:
      - db
    entrypoint: ["/bin/sh", "-c"]
    command: ["./node_modules/.bin/prisma db push --config /app/prisma.config.ts"]
    restart: "no"

volumes:
  pg_data:
  uploads:
