services:
  db:
    image: postgres:16-alpine
    container_name: dropzone-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: dropzone
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your .env file}
      POSTGRES_DB: dropzone
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  app:
    image: ghcr.io/birdtruther/dropzone-app:latest
    container_name: dropzone-app
    restart: unless-stopped
    ports:
      - "8742:3000"
    env_file:
      - .env
    depends_on:
      - db
    volumes:
      - ./uploads:/app/public/uploads

volumes:
  pg_data:
    external: true
    name: dropzone-app_pg_data
